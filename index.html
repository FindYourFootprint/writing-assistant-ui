<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT - Writing & Citation Assistant</title>
  <style>
    :root {
      --bg-dark: #171717;
      --bg-chat: #212121;
      --bg-sidebar: #171717;
      --bg-message-user: #303030;
      --bg-input: #2f2f2f;
      --border-color: #383838;
      --text-main: #ececec;
      --text-muted: #b4b4b4;
      --accent-color: #10a37f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-chat); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Navigation */
    #sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: #222; }

    .style-box {
      margin-top: auto;
      background: #222;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .style-box label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .style-box textarea {
      background: #1a1a1a;
      border: 1px solid #333;
      color: var(--text-main);
      border-radius: 4px;
      padding: 6px;
      font-size: 0.8rem;
      resize: none;
      height: 80px;
      outline: none;
    }

    /* Main Chat Layout */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-dark);
      font-size: 0.95rem;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .user-message {
      background-color: var(--bg-message-user);
      align-self: flex-end;
      color: #fff;
    }
    .assistant-message {
      background-color: transparent;
      align-self: flex-start;
      color: var(--text-main);
      width: 100%;
    }

    .meta-tag {
      font-size: 0.75rem;
      color: var(--accent-color);
      font-weight: 600;
    }

    /* Bottom Input Bar */
    .input-wrapper {
      padding: 16px 20px 24px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-color);
    }
    .input-box {
      max-width: 800px;
      margin: 0 auto;
      background: var(--bg-input);
      border-radius: 20px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #424242;
    }

    textarea#user-input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      height: 44px;
      width: 100%;
    }

    .attachment-preview {
      display: none;
      background: #424242;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--accent-color);
      width: fit-content;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #3d3d3d;
      padding-top: 8px;
    }

    label.attach-btn {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #383838;
      transition: background 0.2s;
    }
    label.attach-btn:hover { background: #454545; color: #fff; }
    input[type="file"] { display: none; }

    button.send-btn {
      background: #676767;
      color: var(--bg-dark);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    button.send-btn.active { background: #fff; color: #000; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <button class="new-chat-btn" onclick="clearChat()">
      <span>+</span> New Chat
    </button>
    
    <div class="style-box">
      <label>Writing Style Sample</label>
      <textarea id="style-sample" placeholder="Paste 2-3 paragraphs here to match your sentence length, tone, and style..."></textarea>
    </div>
  </div>

  <!-- Main Chat Workspace -->
  <div id="main-content">
    <header>AI Writing & Citation Assistant</header>

    <div id="chat-container">
      <div class="message assistant-message">
        Hello! I can help draft essays, papers, or articles. Attach a research .docx document below to include citations, or paste a writing sample in the sidebar to match your voice.
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-box">
        <div id="file-tag" class="attachment-preview">📄 <span id="file-name"></span></div>
        <textarea id="user-input" placeholder="Message AI Assistant..." oninput="toggleSendBtn()" onkeydown="handleKeyPress(event)"></textarea>
        
        <div class="controls">
          <div>
            <label class="attach-btn" for="file-input">
              📎 Attach .docx
            </label>
            <input type="file" id="file-input" accept=".docx" onchange="handleFileSelect()" />
          </div>
          <button id="send-btn" class="send-btn" onclick="sendMessage()">↑</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // CORRECT BACKEND API URL (No .static)
    const BASE_URL = "https://sjdnh-writing-assistant-backend.hf.space";

    function toggleSendBtn() {
      const text = document.getElementById('user-input').value.trim();
      const sendBtn = document.getElementById('send-btn');
      if (text.length > 0) {
        sendBtn.classList.add('active');
      } else {
        sendBtn.classList.remove('active');
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleFileSelect() {
      const fileInput = document.getElementById('file-input');
      const fileTag = document.getElementById('file-tag');
      const fileName = document.getElementById('file-name');

      if (fileInput.files[0]) {
        fileName.innerText = fileInput.files[0].name;
        fileTag.style.display = 'block';
      }
    }

    function clearChat() {
      document.getElementById('chat-container').innerHTML = `
        <div class="message assistant-message">
          Chat cleared. Ready for a new prompt!
        </div>
      `;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const messageText = inputEl.value.trim();
      const styleSample = document.getElementById('style-sample').value.trim();
      const fileInput = document.getElementById('file-input');
      const chatContainer = document.getElementById('chat-container');

      if (!messageText) return;

      // Render User Bubble
      const userBubble = document.createElement('div');
      userBubble.className = 'message user-message';
      userBubble.innerText = messageText;
      chatContainer.appendChild(userBubble);

      // Clear input state
      inputEl.value = '';
      toggleSendBtn();

      // Render Assistant Loading Bubble
      const assistantBubble = document.createElement('div');
      assistantBubble.className = 'message assistant-message';
      assistantBubble.innerText = "Processing style samples & generating draft...";
      chatContainer.appendChild(assistantBubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Construct Multipart Request Payload
      const formData = new FormData();
      formData.append('message', messageText);
      formData.append('style_sample', styleSample);
      
      if (fileInput.files[0]) {
        formData.append('file', fileInput.files[0]);
      }

      try {
        const res = await fetch(`${BASE_URL}/chat`, {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          const errText = await res.text();
          assistantBubble.innerText = `Server Error (${res.status}): ${errText}`;
          return;
        }

        const data = await res.json();
        
        let outputText = data.response || "No response generated.";
        assistantBubble.innerText = outputText;

        // Display citation indicator tag if RAG triggered
        if (data.citations_found) {
          const metaTag = document.createElement('span');
          metaTag.className = 'meta-tag';
          metaTag.innerText = "✓ Cited facts from attached research document.";
          assistantBubble.prepend(metaTag);
        }

        // Reset attachment input
        fileInput.value = '';
        document.getElementById('file-tag').style.display = 'none';

      } catch (err) {
        assistantBubble.innerText = "Connection Error: Ensure your Hugging Face Space is live. " + err.message;
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
