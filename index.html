<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini - AI Writing Suite</title>
  <style>
    :root {
      --bg-main: #131314;
      --bg-card: #1e1f20;
      --bg-input: #1e1f20;
      --border-subtle: #2d2f31;
      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --accent-blue: #a8c7fa;
      --accent-pill: #282a2c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

    /* Collapsible Minimal Sidebar */
    #sidebar {
      width: 280px;
      background-color: #0e0e0e;
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .new-chat-btn {
      background: var(--accent-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 28px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .new-chat-btn:hover { background: #333537; }

    .style-box {
      margin-top: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .style-box label { font-size: 0.75rem; color: var(--accent-blue); font-weight: 600; letter-spacing: 0.5px; }
    .style-box textarea {
      background: #131314;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
      resize: none;
      height: 100px;
      outline: none;
    }

    /* Main Workspace */
    #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 16px 20px;
      border-radius: 20px;
      max-width: 85%;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .user-message {
      background-color: var(--bg-card);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .assistant-message {
      background-color: transparent;
      align-self: flex-start;
      color: var(--text-primary);
      width: 100%;
      padding-left: 0;
    }

    .meta-tag {
      font-size: 0.75rem;
      color: var(--accent-blue);
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* Floating Gemini-style Pill Input Bar */
    .input-wrapper { padding: 0 20px 24px; background: transparent; }
    .input-box {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-input);
      border-radius: 32px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    textarea#user-input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      height: 48px;
      width: 100%;
      padding: 4px 0;
    }

    .attachment-preview {
      display: none;
      background: var(--accent-pill);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--accent-blue);
      width: fit-content;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    label.attach-btn {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--accent-pill);
      transition: background 0.2s;
    }
    label.attach-btn:hover { background: #333537; color: #fff; }
    input[type="file"] { display: none; }

    button.send-btn {
      background: #333537;
      color: #888;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    button.send-btn.active { background: var(--accent-blue); color: #000; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="brand">✦ Gemini AI</div>
    <button class="new-chat-btn" onclick="clearChat()">
      <span>+</span> New Chat
    </button>
    
    <div class="style-box">
      <label>Writing Style Sample</label>
      <textarea id="style-sample" placeholder="Paste writing samples here to emulate sentence patterns, vocabulary, and tone..."></textarea>
    </div>
  </div>

  <!-- Workspace -->
  <div id="main-content">
    <header>
      <span>Writing & Citation Engine</span>
      <span style="font-size: 0.8rem; color: #666;">Model: Qwen2.5</span>
    </header>

    <div id="chat-container">
      <div class="message assistant-message">
        Hello! How can I help you draft or write today? Attach a research .docx file below to include automatic facts and citations, or paste a writing sample in the sidebar to match your personal style.
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-box">
        <div id="file-tag" class="attachment-preview">📄 <span id="file-name"></span></div>
        <textarea id="user-input" placeholder="Ask Gemini to draft, edit, or write..." oninput="toggleSendBtn()" onkeydown="handleKeyPress(event)"></textarea>
        
        <div class="controls">
          <div>
            <label class="attach-btn" for="file-input">
              📎 Add Reference (.docx)
            </label>
            <input type="file" id="file-input" accept=".docx" onchange="handleFileSelect()" />
          </div>
          <button id="send-btn" class="send-btn" onclick="sendMessage()">↑</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Ensure this matches your live Hugging Face Space URL
    const BASE_URL = "https://sjdnh-writing-assistant-backend.hf.space";

    function toggleSendBtn() {
      const text = document.getElementById('user-input').value.trim();
      const sendBtn = document.getElementById('send-btn');
      if (text.length > 0) {
        sendBtn.classList.add('active');
      } else {
        sendBtn.classList.remove('active');
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleFileSelect() {
      const fileInput = document.getElementById('file-input');
      const fileTag = document.getElementById('file-tag');
      const fileName = document.getElementById('file-name');

      if (fileInput.files[0]) {
        fileName.innerText = fileInput.files[0].name;
        fileTag.style.display = 'block';
      }
    }

    function clearChat() {
      document.getElementById('chat-container').innerHTML = `
        <div class="message assistant-message">
          Chat cleared. Ready for your next prompt!
        </div>
      `;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const messageText = inputEl.value.trim();
      const styleSample = document.getElementById('style-sample').value.trim();
      const fileInput = document.getElementById('file-input');
      const chatContainer = document.getElementById('chat-container');

      if (!messageText) return;

      // User Message Bubble
      const userBubble = document.createElement('div');
      userBubble.className = 'message user-message';
      userBubble.innerText = messageText;
      chatContainer.appendChild(userBubble);

      inputEl.value = '';
      toggleSendBtn();

      // Assistant Loading Bubble
      const assistantBubble = document.createElement('div');
      assistantBubble.className = 'message assistant-message';
      assistantBubble.innerText = "Thinking & drafting...";
      chatContainer.appendChild(assistantBubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const formData = new FormData();
      formData.append('message', messageText);
      formData.append('style_sample', styleSample);
      
      if (fileInput.files[0]) {
        formData.append('file', fileInput.files[0]);
      }

      try {
        const res = await fetch(`${BASE_URL}/chat`, {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          const errText = await res.text();
          assistantBubble.innerText = `Error (${res.status}): ${errText}`;
          return;
        }

        const data = await res.json();
        assistantBubble.innerText = data.response || "No response generated.";

        if (data.citations_found) {
          const metaTag = document.createElement('span');
          metaTag.className = 'meta-tag';
          metaTag.innerText = "✓ Research context integrated & cited.";
          assistantBubble.prepend(metaTag);
        }

        fileInput.value = '';
        document.getElementById('file-tag').style.display = 'none';

      } catch (err) {
        assistantBubble.innerText = "Connection Error: Ensure your Hugging Face Space is active. " + err.message;
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
